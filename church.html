<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교회 페이지</title>
  <link rel="stylesheet" href="css/portfolio.css">
  <style>
    /* 교회 페이지를 위한 약간의 색상 변형 */
    body {
      background-image: radial-gradient(circle at top right, #064e3b, #0f172a 40%, #020617);
    }
    .orb-1 { background-color: #10b981; }
    .orb-2 { background-color: #0ea5e9; }
    .orb-3 { background-color: #6366f1; }
  </style>
</head>
<body>
  <!-- Animated Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  
  <div class="container">
    <div class="card">
      <div class="profile-img" style="background: linear-gradient(135deg, #10b981, #0ea5e9);">
        <div>⛪</div>
      </div>
      <h1 class="title" style="background: linear-gradient(to right, #34d399, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        교회 메뉴
      </h1>
      <p class="subtitle">
        조치원성결교회 청년부에 오신 것을 환영합니다.<br>
        겨울 MT 퀴즈를 시작하려면 아래 버튼을 클릭하세요.
      </p>
      
      <div class="btn-group">
        <a href="portfolio.html" class="btn btn-outline">
          <span>← 뒤로 가기</span>
        </a>
        <a href="quiz.html" class="btn btn-mt">
          <span>
            <svg style="width:22px;height:22px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            26 청년부 MT
          </span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Add 3D tilt effect to the card
    const card = document.querySelector('.card');
    document.addEventListener('mousemove', (e) => {
      if (window.innerWidth <= 768) return;
      
      const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
      card.style.transform = `perspective(1000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg) translateY(-8px)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg) translateY(0)`;
    });
  </script>
</body>
</html>
